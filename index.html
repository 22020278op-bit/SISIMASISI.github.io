<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISIMASISI</title>
<style>
  @font-face {
    font-family: "Minecraft";
    src: url("assets/minecraft.ttf") format("truetype");
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Minecraft", monospace;
  }

  .bg {
    position: fixed;
    inset: -40px;
    width: calc(100% + 80px);
    height: calc(100% + 80px);
    object-fit: cover;
    filter: blur(18px) brightness(0.65);
    transform: scale(1.05);
    z-index: 0;
  }

  /* ---------- СТАРТОВЫЙ ЭКРАН ---------- */
  .overlay {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15), rgba(0,0,0,0.55));
    transition: opacity 0.6s, transform 0.6s;
  }

  .overlay.hidden { opacity: 0; transform: scale(1.1); pointer-events: none; }

  h1 {
    font-size: clamp(48px, 12vw, 160px);
    color: #fff;
    letter-spacing: 6px;
    text-shadow: 0 0 20px rgba(255,255,255,0.35), 4px 4px 0 rgba(0,0,0,0.6);
    animation: float 3s ease-in-out infinite;
    user-select: none;
    text-align: center;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .play-btn {
    font-family: "Minecraft", monospace;
    font-size: clamp(20px, 4vw, 36px);
    color: #fff;
    padding: 18px 64px;
    background: linear-gradient(180deg, #5cb85c, #3d8b3d);
    border: 4px solid #2c2c2c;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 4px;
    text-transform: uppercase;
    box-shadow: 0 6px 0 #2c6e2c, 0 10px 20px rgba(0,0,0,0.5);
    transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
  }

  .play-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
  .play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2c6e2c, 0 4px 8px rgba(0,0,0,0.5); }

  /* ---------- МЕНЮ ---------- */
  .menu {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: none;
    flex-direction: column;
    background: rgba(0, 0, 0, 0.35);
    animation: fadeIn 0.6s ease;
  }

  .menu.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: rgba(0, 0, 0, 0.55);
    border-bottom: 3px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
  }

  .topbar .logo {
    color: #fff;
    font-size: 22px;
    letter-spacing: 3px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
  }

  .topbar-right { display: flex; align-items: center; gap: 10px; }

  /* Иконки в топбаре */
  .icon-btn {
    position: relative;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    cursor: pointer;
    color: #fff;
    font-size: 20px;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }

  .icon-btn:hover { background: rgba(255,255,255,0.2); border-color: #5cb85c; transform: translateY(-2px); }
  .icon-btn.active { border-color: #5cb85c; background: rgba(92,184,92,0.25); }

  .badge {
    position: absolute;
    top: -8px;
    right: -8px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    background: #e74c3c;
    border: 2px solid #1e1e1e;
    border-radius: 10px;
    color: #fff;
    font-size: 11px;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .badge.show { display: flex; }

  .profile {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 6px;
    border: 2px solid transparent;
    transition: background 0.2s, border-color 0.2s;
    margin-left: 6px;
  }

  .profile:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 6px;
    border: 3px solid #5cb85c;
    object-fit: cover;
    background: #333;
    image-rendering: pixelated;
  }

  .nick { color: #fff; font-size: 16px; letter-spacing: 1px; text-shadow: 2px 2px 0 rgba(0,0,0,0.7); }
  .nick.guest { color: #ccc; }

  .menu-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }

  .panel {
    background: rgba(0, 0, 0, 0.55);
    border: 3px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .panel h2 {
    color: #fff;
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid rgba(255,255,255,0.15);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
  }

  .panel h3 {
    color: #9fe89f;
    font-size: 15px;
    letter-spacing: 1px;
    margin: 16px 0 8px;
  }

  .panel .empty { color: #aaa; font-size: 14px; letter-spacing: 1px; padding: 16px 0; text-align: center; }

  .placeholder-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }

  .slot {
    background: rgba(255,255,255,0.07);
    border: 2px dashed rgba(255,255,255,0.25);
    border-radius: 6px;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 13px;
    letter-spacing: 1px;
  }

  .slot.link-card {
    flex-direction: column;
    gap: 12px;
    padding: 12px;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.45);
    text-decoration: none;
    color: #fff;
    font-size: 16px;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }

  .slot.link-card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    border-radius: 4px;
    border: 2px solid #3d8b3d;
  }

  .slot.link-card .play-txt {
    color: #8dff8d;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
  }

  .slot.link-card:hover {
    transform: translateY(-4px);
    border-color: #5cb85c;
    box-shadow: 0 10px 24px rgba(0,0,0,0.55);
  }

  /* ---------- БОКОВАЯ ПАНЕЛЬ (игроки / заявки) ---------- */
  .side-panel {
    position: fixed;
    top: 74px;
    right: 0;
    bottom: 0;
    width: min(360px, 92vw);
    z-index: 8;
    background: rgba(15,15,15,0.97);
    border-left: 3px solid #3d8b3d;
    transform: translateX(110%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
  }

  .side-panel.show { transform: translateX(0); }

  .side-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 2px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 17px;
    letter-spacing: 2px;
  }

  .side-close {
    background: none;
    border: none;
    color: #aaa;
    font-size: 22px;
    cursor: pointer;
    font-family: inherit;
  }
  .side-close:hover { color: #fff; }

  .side-body { flex: 1; overflow-y: auto; padding: 14px; }

  .side-body h4 {
    color: #9fe89f;
    font-size: 13px;
    letter-spacing: 1px;
    margin: 14px 0 8px;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 6px;
  }

  .player-row img {
    width: 40px;
    height: 40px;
    border-radius: 5px;
    border: 2px solid #5cb85c;
    object-fit: cover;
    image-rendering: pixelated;
    background: #333;
  }

  .player-row .pname { flex: 1; color: #fff; font-size: 14px; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; }

  .mini-btn {
    font-family: "Minecraft", monospace;
    font-size: 11px;
    color: #fff;
    padding: 7px 9px;
    border: 2px solid #2c2c2c;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    background: #555;
    white-space: nowrap;
    transition: filter 0.15s;
  }

  .mini-btn:hover { filter: brightness(1.25); }
  .mini-btn.green { background: #3d8b3d; }
  .mini-btn.blue { background: #2d7dd2; }
  .mini-btn.red { background: #b93e3a; }
  .mini-btn.dim { background: #444; color: #aaa; cursor: default; }
  .mini-btn.dim:hover { filter: none; }

  .no-login {
    color: #ffbb6b;
    font-size: 13px;
    line-height: 1.6;
    letter-spacing: 1px;
    text-align: center;
    padding: 24px 8px;
  }

  /* ---------- ЧАТ ---------- */
  .chat-win {
    position: fixed;
    right: 16px;
    bottom: 16px;
    width: min(360px, 94vw);
    height: 460px;
    z-index: 9;
    background: rgba(15,15,15,0.98);
    border: 3px solid #3d8b3d;
    border-radius: 6px;
    display: none;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
  }

  .chat-win.show { display: flex; animation: pop 0.2s ease; }

  .chat-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 2px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .chat-head img { width: 30px; height: 30px; border-radius: 4px; border: 2px solid #5cb85c; object-fit: cover; }
  .chat-head .cname { flex: 1; }
  .chat-head button { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; font-family: inherit; }
  .chat-head button:hover { color: #fff; }

  .chat-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

  .msg {
    max-width: 80%;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.45;
    letter-spacing: 0.5px;
    word-wrap: break-word;
  }

  .msg.mine { align-self: flex-end; background: #3d8b3d; color: #fff; border: 2px solid #2c6e2c; }
  .msg.theirs { align-self: flex-start; background: #333; color: #eee; border: 2px solid #555; }
  .msg .mtime { display: block; font-size: 10px; opacity: 0.65; margin-top: 4px; text-align: right; }

  .chat-input { display: flex; gap: 8px; padding: 10px; border-top: 2px solid rgba(255,255,255,0.15); }

  .chat-input input {
    flex: 1;
    font-family: "Minecraft", monospace;
    font-size: 13px;
    color: #fff;
    background: #2c2c2c;
    border: 2px solid #444;
    border-radius: 4px;
    padding: 9px 10px;
    outline: none;
  }

  .chat-input input:focus { border-color: #5cb85c; }

  .chat-input button {
    font-family: "Minecraft", monospace;
    font-size: 13px;
    color: #fff;
    background: #3d8b3d;
    border: 2px solid #2c6e2c;
    border-radius: 4px;
    padding: 0 14px;
    cursor: pointer;
  }

  .chat-input button:hover { filter: brightness(1.2); }

  /* ---------- МОДАЛКА ---------- */
  .modal-back {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .modal-back.show { display: flex; }

  .modal {
    background: #1e1e1e;
    border: 4px solid #3d8b3d;
    border-radius: 6px;
    padding: 28px;
    width: min(440px, 92vw);
    max-height: 90vh;
    overflow-y: auto;
    animation: pop 0.25s ease;
  }

  @keyframes pop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal h3 { color: #fff; font-size: 20px; letter-spacing: 2px; margin-bottom: 18px; text-align: center; }

  .modal label { display: block; color: #bbb; font-size: 13px; letter-spacing: 1px; margin: 12px 0 6px; }

  .modal input[type="text"],
  .modal input[type="password"] {
    width: 100%;
    font-family: "Minecraft", monospace;
    font-size: 15px;
    color: #fff;
    background: #2c2c2c;
    border: 3px solid #444;
    border-radius: 4px;
    padding: 10px 12px;
    outline: none;
  }

  .modal input:focus { border-color: #5cb85c; }

  .avatar-picker { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; align-items: center; }

  .avatar-opt {
    width: 48px;
    height: 48px;
    border-radius: 6px;
    border: 3px solid #444;
    cursor: pointer;
    image-rendering: pixelated;
    transition: transform 0.1s, border-color 0.15s;
    object-fit: cover;
  }

  .avatar-opt:hover { transform: scale(1.08); }
  .avatar-opt.sel { border-color: #5cb85c; box-shadow: 0 0 10px rgba(92,184,92,0.6); }

  .upload-btn {
    font-family: "Minecraft", monospace;
    font-size: 12px;
    color: #fff;
    background: #2d7dd2;
    border: 2px solid #1f5a99;
    border-radius: 4px;
    padding: 10px 12px;
    cursor: pointer;
    letter-spacing: 1px;
  }

  .upload-btn:hover { filter: brightness(1.2); }

  .modal-btns { display: flex; gap: 12px; margin-top: 22px; }

  .modal-btns button {
    flex: 1;
    font-family: "Minecraft", monospace;
    font-size: 15px;
    color: #fff;
    padding: 12px;
    border: 3px solid #2c2c2c;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: filter 0.15s;
  }

  .modal-btns button:hover { filter: brightness(1.2); }

  .btn-save { background: linear-gradient(180deg, #5cb85c, #3d8b3d); box-shadow: 0 4px 0 #2c6e2c; }
  .btn-cancel { background: linear-gradient(180deg, #777, #555); box-shadow: 0 4px 0 #444; }
  .btn-logout { background: linear-gradient(180deg, #d9534f, #b93e3a); box-shadow: 0 4px 0 #922f2c; }
  .btn-blue { background: linear-gradient(180deg, #4a9be0, #2d7dd2); box-shadow: 0 4px 0 #1f5a99; }

  .modal .err { color: #ff7b7b; font-size: 12px; letter-spacing: 1px; min-height: 16px; margin-top: 10px; text-align: center; }

  .profile-view { text-align: center; }
  .profile-view .big-av { width: 96px; height: 96px; border-radius: 8px; border: 4px solid #5cb85c; object-fit: cover; image-rendering: pixelated; }
  .profile-view .big-nick { color: #fff; font-size: 18px; letter-spacing: 2px; margin-top: 12px; }

  /* ---------- Секции в профиле ---------- */
  .sec-title {
    color: #9fe89f;
    font-size: 13px;
    letter-spacing: 2px;
    margin: 20px 0 8px;
    padding-bottom: 6px;
    border-bottom: 2px solid rgba(255,255,255,0.12);
  }

  .acc-list { display: flex; flex-direction: column; gap: 8px; }

  .acc-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 9px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .acc-row:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.35); }
  .acc-row.active { border-color: #5cb85c; background: rgba(92,184,92,0.18); }
  .acc-row img { width: 36px; height: 36px; border-radius: 5px; border: 2px solid #5cb85c; object-fit: cover; image-rendering: pixelated; background: #333; }
  .acc-row .an { flex: 1; color: #fff; font-size: 14px; letter-spacing: 1px; }
  .acc-row .now { color: #5cb85c; font-size: 11px; letter-spacing: 1px; }

  .set-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    color: #ccc;
    font-size: 13px;
    letter-spacing: 1px;
  }

  .set-row input[type="range"] {
    flex: 1;
    accent-color: #5cb85c;
    cursor: pointer;
  }

  .set-row .vol-val { color: #fff; min-width: 42px; text-align: right; }

  .set-btn {
    font-family: "Minecraft", monospace;
    font-size: 12px;
    color: #fff;
    padding: 9px 14px;
    border: 3px solid #2c2c2c;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    background: #555;
    transition: filter 0.15s;
  }

  .set-btn:hover { filter: brightness(1.25); }
  .set-btn.on { background: #3d8b3d; box-shadow: 0 3px 0 #2c6e2c; }
  .set-btn.off { background: #b93e3a; box-shadow: 0 3px 0 #922f2c; }
</style>
</head>
<body>
  <video id="bg" class="bg" src="assets/bg.mp4" autoplay loop playsinline></video>

  <!-- Стартовый экран -->
  <div class="overlay" id="startScreen">
    <h1>SISIMASISI</h1>
    <button class="play-btn" id="playBtn">Играть</button>
  </div>

  <!-- Меню -->
  <div class="menu" id="menu">
    <div class="topbar">
      <div class="logo">SISIMASISI</div>
      <div class="topbar-right">
        <div class="icon-btn" id="addBtn" title="Игроки и друзья">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff">
            <circle cx="9" cy="7.5" r="4"/>
            <path d="M1.5 20.5c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5z"/>
            <path d="M19.5 3.5v6M16.5 6.5h6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          <span class="badge" id="addBadge">0</span>
        </div>

        <div class="icon-btn" id="bellBtn" title="Заявки в друзья">
          <span style="font-size:22px;">🔔</span>
          <span class="badge" id="bellBadge">0</span>
        </div>

        <div class="profile" id="profileBtn" title="Профиль / регистрация">
          <img class="avatar" id="avatarImg" src="" alt="avatar">
          <span class="nick guest" id="nickTxt">Гость</span>
        </div>
      </div>
    </div>

    <div class="menu-content">
      <div class="panel">
        <h2>НОВОСТИ</h2>
        <div class="empty">Пока новостей нет...</div>
      </div>

      <div class="panel">
        <h2>РАЗДЕЛЫ</h2>
        <div class="placeholder-grid">
          <a class="slot link-card" href="https://t.me/sisimasisiexe" target="_blank" rel="noopener">
            <img src="assets/card.jpg" alt="">
            <span class="play-txt">Играть на сисимасиси</span>
          </a>
          <div class="slot">Скоро...</div>
          <div class="slot">Скоро...</div>
          <div class="slot">Скоро...</div>
          <div class="slot">Скоро...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Боковая панель: игроки / заявки -->
  <div class="side-panel" id="sidePanel">
    <div class="side-head">
      <span id="sideTitle">ИГРОКИ</span>
      <button class="side-close" id="sideClose">✕</button>
    </div>
    <div class="side-body" id="sideBody"></div>
  </div>

  <!-- Чат -->
  <div class="chat-win" id="chatWin">
    <div class="chat-head">
      <img id="chatAvatar" src="" alt="">
      <span class="cname" id="chatName">Ник</span>
      <button id="chatClose">✕</button>
    </div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" maxlength="200" placeholder="Сообщение...">
      <button id="chatSend">➤</button>
    </div>
  </div>

  <!-- Модалка профиля / регистрации -->
  <div class="modal-back" id="modalBack">
    <div class="modal">
      <h3 id="modalTitle">РЕГИСТРАЦИЯ</h3>

      <!-- Форма регистрации -->
      <div id="regForm">
        <label>Ник</label>
        <input type="text" id="nickInput" maxlength="16" placeholder="Введи ник" autocomplete="off">

        <label>Пароль</label>
        <input type="password" id="passInput" maxlength="32" placeholder="Введи пароль">

        <label>Аватарка (своя или пресет)</label>
        <div class="avatar-picker" id="avatarPicker">
          <button class="upload-btn" id="uploadBtn">📁 Загрузить свою</button>
        </div>
        <input type="file" id="avatarFile" accept="image/*" style="display:none;">

        <div class="err" id="errMsg"></div>

        <div class="modal-btns">
          <button class="btn-save" id="saveBtn">Сохранить</button>
          <button class="btn-cancel" id="cancelBtn">Отмена</button>
        </div>
      </div>

      <!-- Профиль залогиненного -->
      <div id="accForm" style="display:none;">
        <div class="profile-view">
          <img class="big-av" id="bigAvatar" src="" alt="">
          <div class="big-nick" id="bigNick"></div>
        </div>

        <div class="sec-title">АККАУНТЫ</div>
        <div class="acc-list" id="accList"></div>

        <div class="modal-btns">
          <button class="btn-blue" id="addAccBtn">+ Аккаунт</button>
          <button class="btn-blue" id="changeAvBtn">Аватарка</button>
        </div>

        <div class="sec-title">НАСТРОЙКИ</div>
        <div class="set-row">
          <span>Громкость фона</span>
          <input type="range" id="volRange" min="0" max="100" step="1">
          <span class="vol-val" id="volVal">25%</span>
        </div>
        <div class="set-row">
          <span>Фоновое видео</span>
          <button class="set-btn" id="videoToggle">⏹ Стоп</button>
        </div>

        <div class="modal-btns">
          <button class="btn-logout" id="logoutBtn">Выйти</button>
        </div>
        <div class="modal-btns">
          <button class="btn-cancel" id="closeBtn">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ================= ХРАНИЛИЩЕ ================= */
    const K = {
      users:   "sisimasisi_users",
      session: "sisimasisi_session",
      reqs:    "sisimasisi_requests",
      chats:   "sisimasisi_chats",
      settings: "sisimasisi_settings"
    };

    const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
    const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
    const getUsers = () => load(K.users, {});
    const setUsers = u => save(K.users, u);
    const getReqs = () => load(K.reqs, []);
    const setReqs = r => save(K.reqs, r);
    const getChats = () => load(K.chats, {});
    const setChats = c => save(K.chats, c);

    // сессия хранится в sessionStorage (своя на вкладку — можно открыть 2 вкладки
    // и играть за двух разных игроков), дублируется в localStorage для новой вкладки
    const getSession = () => sessionStorage.getItem(K.session) ?? localStorage.getItem(K.session);
    const setSession = n => { sessionStorage.setItem(K.session, n); localStorage.setItem(K.session, n); };
    const clearSession = () => { sessionStorage.removeItem(K.session); localStorage.removeItem(K.session); };

    const me = () => { const n = getSession(); return n ? (getUsers()[n] || null) : null; };
    const myNick = () => getSession();

    const friendsOf = n => (getUsers()[n]?.friends) || [];
    const isFriend = (a, b) => friendsOf(a).includes(b);

    /* ================= АВАТАРКИ ================= */
    const AVATAR_COLORS = ["#5cb85c", "#e74c3c", "#3498db", "#f1c40f", "#9b59b6", "#e67e22", "#1abc9c", "#ecf0f1"];

    function makeAvatar(color) {
      const c = document.createElement("canvas");
      c.width = c.height = 8;
      const ctx = c.getContext("2d");
      ctx.fillStyle = color; ctx.fillRect(0, 0, 8, 8);
      ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(0, 0, 8, 2);
      ctx.fillStyle = "#fff"; ctx.fillRect(1, 3, 2, 2); ctx.fillRect(5, 3, 2, 2);
      ctx.fillStyle = "#222"; ctx.fillRect(2, 4, 1, 1); ctx.fillRect(6, 4, 1, 1);
      ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(2, 6, 4, 1);
      return c.toDataURL();
    }

    // загрузка своей картинки → квадрат 64x64 dataURL
    function processFile(file, cb) {
      if (!file || !file.type.startsWith("image/")) return;
      const r = new FileReader();
      r.onload = e => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = c.height = 64;
          const ctx = c.getContext("2d");
          const s = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 64, 64);
          cb(c.toDataURL("image/png"));
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    }

    /* ================= НАСТРОЙКИ (громкость / фоновое видео) ================= */
    const getSettings = () => Object.assign({ volume: 25, videoOn: true }, load(K.settings, {}));
    const setSettings = s => save(K.settings, s);

    /* ================= ЗВУК ВИДЕО ================= */
    const video = document.getElementById("bg");

    function applySettings() {
      const s = getSettings();
      video.muted = false;
      video.volume = Math.max(0, Math.min(1, s.volume / 100));
      if (s.videoOn) video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
      else video.pause();

      const vr = document.getElementById("volRange");
      const vv = document.getElementById("volVal");
      const vt = document.getElementById("videoToggle");
      if (vr) vr.value = s.volume;
      if (vv) vv.textContent = s.volume + "%";
      if (vt) {
        vt.textContent = s.videoOn ? "⏹ Стоп" : "▶ Включить";
        vt.classList.toggle("on", s.videoOn);
        vt.classList.toggle("off", !s.videoOn);
      }
    }

    function tryPlay() {
      const s = getSettings();
      if (!s.videoOn) return;
      video.muted = false;
      video.volume = Math.max(0, Math.min(1, s.volume / 100));
      video.play().catch(() => {});
    }

    video.play().catch(() => { video.muted = true; });
    document.addEventListener("click", tryPlay, { once: true });
    document.addEventListener("keydown", tryPlay, { once: true });

    // ползунок громкости
    document.getElementById("volRange").addEventListener("input", e => {
      const s = getSettings();
      s.volume = +e.target.value;
      setSettings(s);
      applySettings();
    });

    // стоп / включить фоновое видео
    document.getElementById("videoToggle").addEventListener("click", () => {
      const s = getSettings();
      s.videoOn = !s.videoOn;
      setSettings(s);
      applySettings();
    });

    /* ================= СТАРТ → МЕНЮ ================= */
    document.getElementById("playBtn").addEventListener("click", () => {
      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("menu").classList.add("show");
      renderAll();
    });

    /* ================= ПРОФИЛЬ ================= */
    const nickTxt = document.getElementById("nickTxt");
    const avatarImg = document.getElementById("avatarImg");
    const modalBack = document.getElementById("modalBack");
    const regForm = document.getElementById("regForm");
    const accForm = document.getElementById("accForm");
    const modalTitle = document.getElementById("modalTitle");
    const errMsg = document.getElementById("errMsg");

    let selectedAvatar = makeAvatar(AVATAR_COLORS[0]);
    let uploadMode = "reg"; // "reg" | "change"

    function renderProfile() {
      const u = me();
      if (u) {
        nickTxt.textContent = u.nick;
        nickTxt.classList.remove("guest");
        avatarImg.src = u.avatar;
      } else {
        nickTxt.textContent = "Гость";
        nickTxt.classList.add("guest");
        avatarImg.src = makeAvatar("#555");
      }
    }

    let regMode = "new"; // "new" — обычная регистрация, "add" — добавление аккаунта из профиля

    function renderAccList() {
      const list = document.getElementById("accList");
      const users = getUsers();
      const cur = myNick();
      list.innerHTML = Object.keys(users).map(n => `
        <div class="acc-row ${n === cur ? "active" : ""}" data-acc="${n}">
          <img src="${users[n].avatar}" alt="">
          <span class="an">${n}</span>
          ${n === cur ? '<span class="now">✔ текущий</span>' : ""}
        </div>`).join("");
    }

    // переключение аккаунта кликом по строке
    document.getElementById("accList").addEventListener("click", e => {
      const row = e.target.closest("[data-acc]");
      if (!row) return;
      const n = row.dataset.acc;
      if (n === myNick()) return;
      setSession(n);
      closeSide();
      closeChat();
      renderAll();
      openModal(); // обновить вид профиля
    });

    // добавить новый аккаунт (из профиля)
    document.getElementById("addAccBtn").addEventListener("click", () => {
      regMode = "add";
      modalTitle.textContent = "НОВЫЙ АККАУНТ";
      errMsg.textContent = "";
      regForm.style.display = "block";
      accForm.style.display = "none";
      document.getElementById("nickInput").value = "";
      document.getElementById("passInput").value = "";
      selectedAvatar = makeAvatar(AVATAR_COLORS[0]);
      rebuildPicker();
    });

    function openModal() {
      errMsg.textContent = "";
      regMode = "new";
      const u = me();
      if (u) {
        modalTitle.textContent = "ПРОФИЛЬ";
        regForm.style.display = "none";
        accForm.style.display = "block";
        document.getElementById("bigAvatar").src = u.avatar;
        document.getElementById("bigNick").textContent = u.nick;
        renderAccList();
        applySettings();
      } else {
        modalTitle.textContent = "РЕГИСТРАЦИЯ";
        regForm.style.display = "block";
        accForm.style.display = "none";
        document.getElementById("nickInput").value = "";
        document.getElementById("passInput").value = "";
        selectedAvatar = makeAvatar(AVATAR_COLORS[0]);
        rebuildPicker();
      }
      modalBack.classList.add("show");
    }

    const closeModal = () => modalBack.classList.remove("show");

    document.getElementById("profileBtn").addEventListener("click", openModal);
    document.getElementById("cancelBtn").addEventListener("click", () => {
      // при добавлении аккаунта «Отмена» возвращает в профиль
      regMode === "add" ? openModal() : closeModal();
    });
    document.getElementById("closeBtn").addEventListener("click", closeModal);
    modalBack.addEventListener("click", e => { if (e.target === modalBack) closeModal(); });

    // пресеты аватарок
    function rebuildPicker() {
      const picker = document.getElementById("avatarPicker");
      picker.querySelectorAll(".avatar-opt").forEach(e => e.remove());
      AVATAR_COLORS.forEach((col, i) => {
        const img = document.createElement("img");
        img.className = "avatar-opt" + (img.src === selectedAvatar ? "" : "");
        img.src = makeAvatar(col);
        if (img.src === selectedAvatar) img.classList.add("sel");
        img.addEventListener("click", () => {
          picker.querySelectorAll(".avatar-opt").forEach(e => e.classList.remove("sel"));
          img.classList.add("sel");
          selectedAvatar = img.src;
        });
        picker.appendChild(img);
      });
    }

    // загрузка своей аватарки
    document.getElementById("uploadBtn").addEventListener("click", () => {
      // если открыт ActiveForm профиля — меняем аватарку текущему, иначе — новому аккаунту
      uploadMode = accForm.style.display === "block" ? "change" : "reg";
      document.getElementById("avatarFile").click();
    });
    document.getElementById("changeAvBtn").addEventListener("click", () => {
      uploadMode = "change";
      document.getElementById("avatarFile").click();
    });
    document.getElementById("avatarFile").addEventListener("change", e => {
      processFile(e.target.files[0], dataUrl => {
        if (uploadMode === "change") {
          const u = me();
          if (!u) return;
          const users = getUsers();
          users[u.nick].avatar = dataUrl;
          setUsers(users);
          selectedAvatar = dataUrl;
          renderProfile();
          document.getElementById("bigAvatar").src = dataUrl;
        } else {
          selectedAvatar = dataUrl;
          const picker = document.getElementById("avatarPicker");
          picker.querySelectorAll(".avatar-opt").forEach(el => el.classList.remove("sel"));
          if (!picker.querySelector("#customPrev")) {
            const prev = document.createElement("img");
            prev.id = "customPrev";
            prev.className = "avatar-opt sel";
            picker.appendChild(prev);
          }
          document.getElementById("customPrev").src = dataUrl;
        }
      });
      e.target.value = "";
    });

    // регистрация
    document.getElementById("saveBtn").addEventListener("click", () => {
      const nick = document.getElementById("nickInput").value.trim();
      const pass = document.getElementById("passInput").value;

      if (nick.length < 3) { errMsg.textContent = "Ник минимум 3 символа"; return; }
      if (!/^[A-Za-zА-Яа-я0-9_]+$/.test(nick)) { errMsg.textContent = "Только буквы, цифры и _"; return; }
      if (pass.length < 4) { errMsg.textContent = "Пароль минимум 4 символа"; return; }

      const users = getUsers();
      if (users[nick]) { errMsg.textContent = "Такой ник уже занят"; return; }

      users[nick] = { nick, pass, avatar: selectedAvatar, friends: [], created: Date.now() };
      setUsers(users);
      setSession(nick);

      renderAll();
      // при добавлении аккаунта из профиля — остаёмся в окне и переключаемся на него
      regMode === "add" ? openModal() : closeModal();
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      clearSession();
      closeSide();
      closeChat();
      renderAll();
      closeModal();
    });

    /* ================= БОКОВАЯ ПАНЕЛЬ ================= */
    const sidePanel = document.getElementById("sidePanel");
    const sideTitle = document.getElementById("sideTitle");
    const sideBody = document.getElementById("sideBody");
    let sideMode = null; // "players" | "requests"

    const openSide = mode => {
      sideMode = mode;
      sidePanel.classList.add("show");
      document.getElementById("addBtn").classList.toggle("active", mode === "players");
      document.getElementById("bellBtn").classList.toggle("active", mode === "requests");
      renderSide();
    };

    function closeSide() {
      sideMode = null;
      sidePanel.classList.remove("show");
      document.getElementById("addBtn").classList.remove("active");
      document.getElementById("bellBtn").classList.remove("active");
    }

    document.getElementById("addBtn").addEventListener("click", () => {
      sideMode === "players" ? closeSide() : openSide("players");
    });
    document.getElementById("bellBtn").addEventListener("click", () => {
      sideMode === "requests" ? closeSide() : openSide("requests");
    });
    document.getElementById("sideClose").addEventListener("click", closeSide);

    function playerRow(name, avatar, actionsHtml) {
      return `<div class="player-row">
        <img src="${avatar}" alt="">
        <span class="pname">${name}</span>
        ${actionsHtml}
      </div>`;
    }

    function renderSide() {
      const u = me();

      if (!u) {
        sideTitle.textContent = sideMode === "requests" ? "ЗАЯВКИ" : "ИГРОКИ";
        sideBody.innerHTML = `<div class="no-login">Чтобы добавлять друзей и общаться —<br>зарегистрируйся (клик по нику в правом верхнем углу)</div>`;
        return;
      }

      const users = getUsers();
      const reqs = getReqs();

      if (sideMode === "players") {
        sideTitle.textContent = "ИГРОКИ И ДРУЗЬЯ";
        const friends = friendsOf(u.nick);
        const incoming = reqs.filter(r => r.to === u.nick).map(r => r.from);
        const outgoing = reqs.filter(r => r.from === u.nick).map(r => r.to);

        let html = "<h4>ДРУЗЬЯ</h4>";
        if (friends.length === 0) {
          html += `<div class="empty">Пока нет друзей</div>`;
        } else {
          friends.forEach(f => {
            if (!users[f]) return;
            html += playerRow(f, users[f].avatar,
              `<button class="mini-btn blue" data-chat="${f}">💬 Чат</button>
               <button class="mini-btn red" data-unfriend="${f}">✕</button>`);
          });
        }

        html += "<h4>ВСЕ ИГРОКИ</h4>";
        const others = Object.keys(users).filter(n => n !== u.nick);
        if (others.length === 0) html += `<div class="empty">Других игроков нет</div>`;
        others.forEach(n => {
          let btn;
          if (friends.includes(n))      btn = `<button class="mini-btn blue" data-chat="${n}">💬 Чат</button>`;
          else if (incoming.includes(n)) btn = `<button class="mini-btn green" data-accept="${n}">✓ Принять</button>`;
          else if (outgoing.includes(n)) btn = `<button class="mini-btn dim">Заявка...</button>`;
          else                            btn = `<button class="mini-btn green" data-add="${n}">➕ Добавить</button>`;
          html += playerRow(n, users[n].avatar, btn);
        });

        sideBody.innerHTML = html;

      } else {
        sideTitle.textContent = "ЗАЯВКИ В ДРУЗЬЯ";
        const incoming = reqs.filter(r => r.to === u.nick);
        if (incoming.length === 0) {
          sideBody.innerHTML = `<div class="empty">Нет заявок</div>`;
        } else {
          sideBody.innerHTML = incoming.map(r => {
            const p = users[r.from];
            if (!p) return "";
            return playerRow(r.from, p.avatar,
              `<button class="mini-btn green" data-accept="${r.from}">✓ Принять</button>
               <button class="mini-btn red" data-decline="${r.from}">✕</button>`);
          }).join("");
        }
      }
    }

    // делегирование кликов по панели
    sideBody.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      const u = me();
      if (!u) return;

      if (b.dataset.add)      addFriendRequest(u.nick, b.dataset.add);
      if (b.dataset.accept)   acceptRequest(u.nick, b.dataset.accept);
      if (b.dataset.decline)  declineRequest(u.nick, b.dataset.decline);
      if (b.dataset.unfriend) unfriend(u.nick, b.dataset.unfriend);
      if (b.dataset.chat)     openChat(b.dataset.chat);
    });

    /* ================= ДРУЗЬЯ ================= */
    function addFriendRequest(from, to) {
      const reqs = getReqs();
      if (reqs.some(r => r.from === from && r.to === to)) return;
      reqs.push({ from, to, t: Date.now() });
      setReqs(reqs);
      renderAll();
    }

    function acceptRequest(meNick, other) {
      let reqs = getReqs();
      reqs = reqs.filter(r => !(r.from === other && r.to === meNick));
      setReqs(reqs);

      const users = getUsers();
      if (users[meNick] && users[other]) {
        users[meNick].friends = users[meNick].friends || [];
        users[other].friends = users[other].friends || [];
        if (!users[meNick].friends.includes(other)) users[meNick].friends.push(other);
        if (!users[other].friends.includes(meNick)) users[other].friends.push(meNick);
        setUsers(users);
      }
      renderAll();
    }

    function declineRequest(meNick, other) {
      setReqs(getReqs().filter(r => !(r.from === other && r.to === meNick)));
      renderAll();
    }

    function unfriend(a, b) {
      const users = getUsers();
      if (users[a]) users[a].friends = (users[a].friends || []).filter(x => x !== b);
      if (users[b]) users[b].friends = (users[b].friends || []).filter(x => x !== a);
      setUsers(users);
      renderAll();
    }

    /* ================= ЧАТ ================= */
    const chatWin = document.getElementById("chatWin");
    const chatMsgs = document.getElementById("chatMsgs");
    const chatInput = document.getElementById("chatInput");
    let chatWith = null;

    const chatKey = (a, b) => [a, b].sort().join("|");

    function openChat(friend) {
      const u = me();
      if (!u) return;
      chatWith = friend;
      document.getElementById("chatName").textContent = friend;
      document.getElementById("chatAvatar").src = getUsers()[friend]?.avatar || makeAvatar("#555");
      chatWin.classList.add("show");
      renderChat();
      chatInput.focus();
    }

    function closeChat() {
      chatWith = null;
      chatWin.classList.remove("show");
    }

    document.getElementById("chatClose").addEventListener("click", closeChat);

    function renderChat() {
      if (!chatWith) return;
      const u = me();
      const chats = getChats();
      const msgs = chats[chatKey(u.nick, chatWith)] || [];

      chatMsgs.innerHTML = msgs.length
        ? msgs.map(m => {
            const time = new Date(m.t).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
            const cls = m.from === u.nick ? "mine" : "theirs";
            const txt = m.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return `<div class="msg ${cls}">${txt}<span class="mtime">${time}</span></div>`;
          }).join("")
        : `<div class="empty" style="text-align:center;color:#888;font-size:13px;">Напиши первое сообщение!</div>`;

      chatMsgs.scrollTop = chatMsgs.scrollHeight;
    }

    function sendMsg() {
      if (!chatWith) return;
      const u = me();
      const text = chatInput.value.trim();
      if (!text) return;

      const chats = getChats();
      const key = chatKey(u.nick, chatWith);
      chats[key] = chats[key] || [];
      chats[key].push({ from: u.nick, text, t: Date.now() });
      setChats(chats);

      chatInput.value = "";
      renderChat();
    }

    document.getElementById("chatSend").addEventListener("click", sendMsg);
    chatInput.addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });

    /* ================= БЕЙДЖИ ================= */
    function renderBadges() {
      const u = me();
      const reqs = u ? getReqs().filter(r => r.to === u.nick) : [];

      const bell = document.getElementById("bellBadge");
      bell.textContent = reqs.length;
      bell.classList.toggle("show", reqs.length > 0);

      // у входящих заявок, показанных в панели игроков, тоже счётчик
      const add = document.getElementById("addBadge");
      add.textContent = reqs.length;
      add.classList.toggle("show", reqs.length > 0);
    }

    /* ================= ОБЩИЙ РЕНДЕР ================= */
    function renderAll() {
      renderProfile();
      renderBadges();
      if (sideMode) renderSide();
      if (chatWith) {
        if (me() && isFriend(me().nick, chatWith)) renderChat();
        else closeChat();
      }
    }

    // синхронизация между вкладками (два аккаунта — два окна = живой чат!)
    window.addEventListener("storage", () => {
      renderAll();
      if (chatWith) renderChat();
    });

    rebuildPicker();
    applySettings();
    renderAll();
  </script>
</body>
</html>
